<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Standings</title>
<style>
  :root {
    --header-bg: #131313;
    --header-text: #ffffff;
    --row-alt-bg: #f5f5f5;
    --border-color: #e0e0e0;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Open Sans", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: var(--font);
    background: transparent;
  }

  .wrapper {
    padding: 8px;
  }

  .last-updated {
    font-size: 11px;
    color: #888;
    text-align: right;
    margin: 0 0 6px 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  thead th {
    background: var(--header-bg);
    color: var(--header-text);
    text-align: center;
    padding: 8px 6px;
    font-weight: 600;
    white-space: nowrap;
  }

  thead th.team-col {
    text-align: left;
  }

  tbody td {
    padding: 7px 6px;
    text-align: center;
    border-bottom: 1px solid var(--border-color);
  }

  tbody tr:nth-child(even) {
    background: var(--row-alt-bg);
  }

  td.team-col {
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  td.team-col img {
    width: 20px;
    height: 20px;
    object-fit: contain;
    border-radius: 3px;
    flex-shrink: 0;
  }

  td.pos-col {
    font-weight: 600;
    width: 28px;
  }

  td.pts-col {
    font-weight: 700;
  }

  .status {
    padding: 20px;
    text-align: center;
    color: #888;
    font-size: 13px;
  }

  .error {
    color: #b00020;
  }
</style>
</head>
<body>
  <div class="wrapper">
    <p class="last-updated" id="lastUpdated"></p>
    <div id="content">
      <div class="status">Standings laden...</div>
    </div>
  </div>

  <script>
    // Pas deze URL aan naar waar jouw standings.json gehost staat.
    // Als deze index.html en standings.json in dezelfde map staan (zoals in deze
    // setup, beide in /docs), volstaat een relatief pad.
    const params = new URLSearchParams(window.location.search);
    const file = params.get("league") || "Heren1.json";
    const file = params.get("title") || "Heren 1ste nationale";
    const DATA_URL = `./standings${file}.json`;

    async function loadStandings() {
      const contentEl = document.getElementById("content");
      const updatedEl = document.getElementById("lastUpdated");

      try {
        const res = await fetch(DATA_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const payload = await res.json();

        const rows = Array.isArray(payload) ? payload : payload.standings;
        const generatedAt = Array.isArray(payload) ? null : payload.generated_at;

        if (!rows || rows.length === 0) {
          contentEl.innerHTML = '<div class="status">Geen standings beschikbaar.</div>';
          return;
        }

        if (generatedAt) {
          const d = new Date(generatedAt);
          updatedEl.textContent = "Laatst bijgewerkt: " + d.toLocaleString("nl-BE");
        }

        let html = "<table><thead><tr>";
        html += '<th>#</th><th class="team-col">Team</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GS</th><th>GA</th><th>GD</th><th>Pts</th>';
        html += "</tr></thead><tbody>";

        for (const row of rows) {
          html += "<tr>";
          html += `<td class="pos-col">${row.position ?? ""}</td>`;
          html += `<td class="team-col">`;
          if (row.logo) {
            html += `<img src="${row.logo}" alt="" loading="lazy" onerror="this.style.display='none'" />`;
          }
          html += `<span>${row.team ?? ""}</span></td>`;
          html += `<td>${row.mp ?? ""}</td>`;
          html += `<td>${row.w ?? ""}</td>`;
          html += `<td>${row.d ?? ""}</td>`;
          html += `<td>${row.l ?? ""}</td>`;
          html += `<td>${row.gs ?? ""}</td>`;
          html += `<td>${row.ga ?? ""}</td>`;
          html += `<td>${row.gd ?? ""}</td>`;
          html += `<td class="pts-col">${row.pts ?? ""}</td>`;
          html += "</tr>";
        }

        html += "</tbody></table>";
        contentEl.innerHTML = html;

        // Automatisch de hoogte doorgeven aan de parent (Twizzit-pagina),
        // zodat het iframe niet met een scrollbalk komt te zitten.
        sendHeightToParent();
      } catch (err) {
        contentEl.innerHTML =
          '<div class="status error">Kon standings niet laden (' + err.message + ')</div>';
      }
    }

    function sendHeightToParent() {
      try {
        const height = document.body.scrollHeight;
        window.parent.postMessage({ type: "clubee-standings-height", height }, "*");
      } catch (e) {
        // negeren als cross-origin postMessage niet lukt
      }
    }

    loadStandings();
    window.addEventListener("resize", sendHeightToParent);
  </script>
</body>
</html>
