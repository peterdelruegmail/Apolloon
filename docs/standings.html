<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apolloon — live ranking</title>
</head>
<body>
<p>De actuele ranking wordt geopend…</p>
<p><a id="liveRanking" href="https://www.apolloon-spurs.be/Handbal-Live/ranking/standings.html">Open de live ranking</a></p>
<script>
  const target = new URL("https://www.apolloon-spurs.be/Handbal-Live/ranking/standings.html");
  target.search = window.location.search;
  target.hash = window.location.hash;
  document.getElementById("liveRanking").href = target.href;
  window.location.replace(target.href);
</script>
<noscript>JavaScript is nodig voor de live ranking. Open de bovenstaande link in een browser met JavaScript.</noscript>
</body>
</html>
