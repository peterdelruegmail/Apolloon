name: Update Clubee Standings

on:
  schedule:
    # Elke 3 uur. Pas de cron-expressie aan naar wens (let op: UTC-tijd).
    - cron: "0 * * * *"
  workflow_dispatch: {}  # laat je ook manueel triggeren via de GitHub UI

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Repo uitchecken
        uses: actions/checkout@v5

      - name: Python installeren
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Standings ophalen
        run: |
          python3 clubee_standings_scraper.py \
            --league 18702 \
            --season ${{ vars.SEASON }} \
            --json docs/standings.json

      - name: Wijzigingen committen (indien nodig)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/standings.json
          git diff --cached --quiet && echo "Geen wijzigingen" || git commit -m "Update standings"
          git push
