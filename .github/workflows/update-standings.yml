name: Update Clubee Standings

on:
  workflow_call:
    inputs:
      LEAGUE:
        required: true
        type: number
      NAME:
        required: true
        type: string
        
permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Repo uitchecken
        uses: actions/checkout@v5
          
      - name: Python installeren
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Standings ophalen
        run: |
          python3 clubee_standings_scraper.py \
            --league ${{ inputs.LEAGUE }} \
            --season ${{ vars.SEASON }} \
            --json docs/standings${{ inputs.NAME }}.json

      - name: Wijzigingen committen (indien nodig)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/standings${{ inputs.NAME }}.json
          
          if git diff --cached --quiet; then
            echo "✅ Geen wijzigingen"
            exit 0
          fi
          
          git add docs/standings${{ inputs.NAME }}.json
          git commit -m "chore: update standings for league ${{ inputs.LEAGUE }}"
          
          # Force push: geen merge conflicts nodig, gewoon overschrijven
          for attempt in {1..10}; do
            if git push --force-with-lease origin main; then
              echo "✅ Push succesvol op attempt $attempt"
              exit 0
            fi
            echo "⚠️ Poging $attempt mislukt, retry..."
            sleep $((RANDOM % 10 + 2))
          done
          
          echo "❌ Push mislukt na 10 pogingen"
          exit 1
