name: Update Clubee Standings

on:
  workflow_call:
    inputs:
      LEAGUE:
        required: true
        type: number
      NAME:
        required: true
        type: string
        
permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Repo uitchecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python installeren
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Standings ophalen
        run: |
          python3 clubee_standings_scraper.py \
            --league ${{ inputs.LEAGUE }} \
            --season ${{ vars.SEASON }} \
            --json docs/standings${{ inputs.NAME }}.json

      - name: Wijzigingen committen (indien nodig)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/standings${{ inputs.NAME }}.json
          
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "Update standings"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin main && break
              echo "Push mislukt, retry ($i)..."
              sleep $((RANDOM % 5 + 1))
            done
          fi
