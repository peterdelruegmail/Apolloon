name: Wekelijkse wedstrijdcontrole

on:
  schedule:
    - cron: '0 9 * * 4'
      timezone: Europe/Brussels
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Rapport per e-mail versturen'
        type: boolean
        default: false
  push:
    branches: [main, codex/wekelijkse-wedstrijdcontrole]
    paths:
      - '.github/scripts/check_match_calendar.py'
      - '.github/scripts/test_match_calendar.py'
      - '.github/workflows/check-match-calendar.yml'

permissions:
  contents: read

concurrency:
  group: wedstrijdcontrole-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test vergelijking
        run: python3 .github/scripts/test_match_calendar.py
      - name: Controleer wedstrijden
        env:
          SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          args=()
          if [ "$SEND_EMAIL" = "true" ]; then
            args+=(--send-email)
          fi
          python3 .github/scripts/check_match_calendar.py "${args[@]}"
      - name: Bewaar rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wedstrijdcontrole
          path: wedstrijdcontrole/
          if-no-files-found: warn
          retention-days: 30
